# Merge these into your existing supabase/config.toml

[functions.initialize-payment]
verify_jwt = true

[functions.verify-payment]
verify_jwt = true

[functions.paystack-webhook]
verify_jwt = false

[functions.setup-rider-payout]
verify_jwt = true

[functions.complete-rider-delivery]
verify_jwt = true

[functions.admin-rider-payouts]
verify_jwt = true

[functions.assign-order]
verify_jwt = true

[functions.mark-order-unavailable]
verify_jwt = true

[functions.whatsapp-webhook]
verify_jwt = false

# Merge this section into supabase/config.toml.
# The catering form supports guest requests, so this endpoint accepts
# anonymous invocation; the function only emails a real, existing request
# and uses email_status to prevent duplicate sends.
[functions.notify-catering-admin]
verify_jwt = false
